<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Registro de salud de tus hijos: ficha de emergencia, tratamientos, visitas y síntomas. Sin nube." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#005da7" />
    <title>FamLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Último recurso: si algo falla fuera de React, mostrar el error en vez de una pantalla en blanco
      function mostrarFalla(m) {
        var r = document.getElementById('root')
        if (r && r.childElementCount && !/Algo falló/.test(r.textContent)) return
        document.body.innerHTML = '<div style="font:16px system-ui;padding:64px 20px;max-width:560px;margin:auto"><h1 style="font-size:22px">Algo falló al abrir la app</h1><p>Tus datos están a salvo. Mandá una captura de este mensaje.</p><pre style="white-space:pre-wrap;background:#e2efff;padding:12px;border-radius:12px;font-size:12px"></pre><button onclick="location.hash=\'#/\';location.reload()" style="width:100%;min-height:48px;border:0;border-radius:24px;background:#005da7;color:#fff;font-size:16px">Volver a cargar</button></div>'
        document.querySelector('pre').textContent = m + '\n\n' + navigator.userAgent
      }
      window.addEventListener('error', function (e) { setTimeout(function () { mostrarFalla(e.message) }, 50) })
      window.addEventListener('unhandledrejection', function (e) { console.error(e.reason) })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
